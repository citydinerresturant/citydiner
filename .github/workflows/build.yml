name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q citydiner-android-project.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build debug APK
        run: gradle assembleDebug --no-daemon
        working-directory: citydiner-android
      - run: cp citydiner-android/app/build/outputs/apk/debug/app-debug.apk CityDiner.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: CityDiner APK (latest)
          files: CityDiner.apk
